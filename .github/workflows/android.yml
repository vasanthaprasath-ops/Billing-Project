name: Android app

on:
  push:
    paths:
      - "web/**"
      - "src/**"
      - "mobile/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/**"
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  parity:
    name: Phone backend matches the Java server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run test:diff
        working-directory: mobile

  apk:
    name: Build installable APK
    needs: parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci && npm run build && npx cap sync android
        working-directory: mobile
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: FreshMart-Billing-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
